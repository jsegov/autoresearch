[project]
name = "es-nq-cross-market-signal"
version = "0.1.0"
description = "Standalone ES/NQ 5-10 minute cross-market OFI direction signal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["pandas>=2.0", "numpy>=1.26", "scikit-learn>=1.4"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

